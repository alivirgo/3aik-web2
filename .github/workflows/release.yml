name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/agent-core/package-lock.json
            packages/cli/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix packages/cli
      - run: npm ci --prefix apps/desktop
      - run: npm run check:all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix packages/cli --omit=dev --audit-level=high
      - run: npm audit --prefix apps/desktop --audit-level=high
      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./packages/agent-core/package.json').version")" = "$version"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$version"
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$version"

  cli:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/agent-core/package-lock.json
            packages/cli/package-lock.json
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix packages/cli
      - run: npm --prefix packages/cli run pack:release
      - name: Verify packed CLI in a clean directory
        shell: bash
        run: |
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" "$GITHUB_WORKSPACE/packages/cli/3aik-cli.tgz"
          version="${GITHUB_REF_NAME#v}"
          test "$("$install_dir/node_modules/.bin/3aik" --version)" = "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: |
            packages/cli/3aik-cli.tgz
            packages/cli/install.ps1
            packages/cli/install.cmd
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/agent-core/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run pack:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/agent-core/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run pack:linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    needs: [cli, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
          if-no-files-found: error
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "3aik $GITHUB_REF_NAME"
