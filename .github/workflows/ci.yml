name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/agent-core/package-lock.json
            packages/cli/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix packages/cli
      - run: npm ci --prefix apps/desktop
      - run: npm run check:all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix packages/cli --omit=dev --audit-level=high
      - run: npm audit --prefix apps/desktop --audit-level=high

  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/agent-core/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run check
      - run: npm --prefix apps/desktop run pack:dir

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            apps/android/*.gradle.kts
            apps/android/gradle.properties
            apps/android/gradle/verification-metadata.xml
            apps/android/gradle/wrapper/gradle-wrapper.properties
            apps/android/app/*.gradle.kts
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Test, lint, and build Android
        shell: bash
        env:
          # Ordinary CI must never inherit release-signing configuration.
          THREEAIK_UPLOAD_KEYSTORE: ""
          THREEAIK_UPLOAD_KEY_ALIAS: ""
          THREEAIK_UPLOAD_STORE_PASSWORD: ""
          THREEAIK_UPLOAD_KEY_PASSWORD: ""
        run: |
          chmod +x apps/android/gradlew apps/android/ci.sh
          cd apps/android
          ./ci.sh
      - name: Verify and stage explicitly unsigned Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/android/app/build/outputs/bundle/release/app-release.aab"
          debug_apk="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          mapping="apps/android/app/build/outputs/mapping/release/mapping.txt"
          test -s "$bundle"
          test -s "$debug_apk"
          test -s "$mapping"
          if jar tf "$bundle" | grep -Eiq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "CI release bundle unexpectedly contains a signing block." >&2
            exit 1
          fi

          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"
          output="android-ci-artifacts"
          mkdir -p "$output/test-report"
          cp "$debug_apk" "$output/3aikGPT-${version}-debug.apk"
          cp "$bundle" "$output/3aikGPT-${version}-CI-UNSIGNED-NOT-FOR-PLAY.aab"
          cp "$mapping" "$output/3aikGPT-${version}-mapping.txt"
          cp apps/android/app/build/reports/lint-results-release.html "$output/"
          cp apps/android/app/build/reports/lint-results-release.sarif "$output/"
          cp -R apps/android/app/build/reports/tests/testDebugUnitTest/. "$output/test-report/"
          (
            cd "$output"
            sha256sum \
              "3aikGPT-${version}-debug.apk" \
              "3aikGPT-${version}-CI-UNSIGNED-NOT-FOR-PLAY.aab" \
              "3aikGPT-${version}-mapping.txt" > SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-unsigned
          path: android-ci-artifacts/
          if-no-files-found: error
