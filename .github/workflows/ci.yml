name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/agent-core/package-lock.json
            packages/cli/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix packages/cli
      - run: npm ci --prefix apps/desktop
      - run: npm run check:all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix packages/cli --omit=dev --audit-level=high
      - run: npm audit --prefix apps/desktop --audit-level=high

  desktop-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/agent-core/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefix packages/agent-core
      - run: npm ci --prefix apps/desktop
      - run: npm --prefix apps/desktop run check
      - run: npm --prefix apps/desktop run pack:dir
